name: release to NuGet

# The shared library release of Snail.Sdk. A v* tag releases every package at that version; run by hand, it packs and
# checks them and pushes only when asked to.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: The version to pack, such as 0.3.0 or 0.3.0-preview.1
        required: true
      push:
        description: Push the packages to NuGet
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: read
      id-token: write
    uses: orldev/Snail.Sdk/.github/workflows/lib-publish.yml@v1
    with:
      version: ${{ inputs.version }}
      push: ${{ github.event_name == 'push' || inputs.push }}
    secrets: inherit
